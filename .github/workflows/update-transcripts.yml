name: Update playlist transcripts
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install --upgrade pip yt-dlp youtube-transcript-api
      - name: Build one video incrementally
        env:
          YTDLP_TIMEOUT_SEC: '90'
        run: python scripts/build_playlist_transcripts.py
      - name: Sync docs
        run: cp -f playlist-transcripts.json docs/playlist-transcripts.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist-transcripts.json playlist-video-status.json playlist-video-transcripts docs/playlist-transcripts.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update one playlist transcript"
          git push
